<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <title>PPT風テトリス</title>
  <meta name="viewport" content="width=480,user-scalable=no">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="tetris-root">
    <div class="left-panel">
      <div class="hold-section">
        <div class="panel-label">HOLD</div>
        <canvas id="hold" width="80" height="80"></canvas>
      </div>
      <div class="stats-section">
        <div><span>ライン数:</span> <span id="lines">0</span></div>
        <div><span>攻撃量:</span> <span id="atk">0</span></div>
        <div><span>DPS:</span> <span id="dps">0.00</span></div>
      </div>
    </div>
    <div class="center-panel">
      <canvas id="board" width="200" height="400"></canvas>
      <div id="combo"></div>
    </div>
    <div class="right-panel">
      <div class="next-section">
        <div class="panel-label">NEXT</div>
        <canvas id="next0" width="80" height="80"></canvas>
        <canvas id="next1" width="80" height="80"></canvas>
        <canvas id="next2" width="80" height="80"></canvas>
        <canvas id="next3" width="80" height="80"></canvas>
      </div>
    </div>
  </div>
  <script src="tetris.js"></script>
</body>
</html>
