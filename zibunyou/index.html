<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <title>テトリス</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="container">
    <canvas id="tetris" width="200" height="400"></canvas>
    <div id="side">
      <div id="hold-label">HOLD</div>
      <canvas id="hold" width="80" height="80"></canvas>
      <div id="next-label">NEXT</div>
      <canvas id="next" width="80" height="320"></canvas>
      <div id="info">
        <div id="score">SCORE: 0</div>
        <div id="lines">LINES: 0</div>
        <div id="ren">REN: 0</div>
        <div id="garbage">GARBAGE: 0</div>
      </div>
    </div>
  </div>
  <script src="main.js"></script>
</body>
</html>
