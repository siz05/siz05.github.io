<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <title>ぷよぷよテトリス風テトリス</title>
  <meta name="viewport" content="width=480, initial-scale=1.0">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="wrapper">
    <div id="hold-section">
      <div class="section-title">HOLD</div>
      <canvas id="hold" width="80" height="80"></canvas>
    </div>
    <div id="info-section">
      <div>
        <span>ライン:</span>
        <span id="lines">0</span>
      </div>
      <div>
        <span>攻撃:</span>
        <span id="attack">0</span>
      </div>
      <div>
        <span>DPS:</span>
        <span id="dps">0.00</span>
      </div>
    </div>
    <div id="next-section">
      <div class="section-title">NEXT</div>
      <div id="next-canvas-list">
        <canvas class="next" width="80" height="80"></canvas>
        <canvas class="next" width="80" height="80"></canvas>
        <canvas class="next" width="80" height="80"></canvas>
        <canvas class="next" width="80" height="80"></canvas>
      </div>
    </div>
    <div id="game-section">
      <canvas id="game" width="320" height="640"></canvas>
      <div id="combo-label"></div>
      <div id="clear-label"></div>
    </div>
  </div>
  <script src="tetris.js"></script>
</body>
</html>
