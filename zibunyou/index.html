<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <title>ぷよぷよテトリス風DT砲/TD系対応テトリス</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="tetris-container">
    <div class="side-panel left">
      <div class="hold-section">
        <div class="section-title">HOLD</div>
        <canvas id="hold-canvas" width="80" height="80"></canvas>
      </div>
      <div class="stats-section">
        <div>ライン数: <span id="line-count">0</span></div>
        <div>攻撃量: <span id="attack-count">0</span></div>
        <div>DPS: <span id="dps-count">0</span></div>
      </div>
    </div>
    <div class="main-panel">
      <canvas id="game-canvas" width="200" height="400"></canvas>
      <div class="event-section">
        <span id="event-text"></span>
      </div>
    </div>
    <div class="side-panel right">
      <div class="next-title">NEXT</div>
      <div class="next-section">
        <canvas id="next-canvas-0" width="80" height="80"></canvas>
        <canvas id="next-canvas-1" width="80" height="80"></canvas>
        <canvas id="next-canvas-2" width="80" height="80"></canvas>
        <canvas id="next-canvas-3" width="80" height="80"></canvas>
      </div>
    </div>
  </div>
  <script src="tetris.js"></script>
</body>
</html>
