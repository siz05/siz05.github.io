<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <title>ぷよぷよテトリス風Tetris</title>
  <meta name="viewport" content="width=640">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="container">
    <div id="left-panel">
      <div id="hold-section">
        <div class="panel-title">HOLD</div>
        <canvas id="hold-canvas" width="80" height="80"></canvas>
      </div>
      <div id="info-section">
        <div id="lines">Lines: 0</div>
        <div id="attack">攻撃量: 0</div>
        <div id="dps">DPS: 0.00</div>
      </div>
    </div>
    <div id="game-panel">
      <canvas id="game-canvas" width="200" height="400"></canvas>
    </div>
    <div id="right-panel">
      <div class="panel-title">NEXT</div>
      <canvas id="next-canvas" width="80" height="320"></canvas>
    </div>
  </div>
  <script src="tetris.js"></script>
</body>
</html>
