<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <title>WebRTC Chat (ICE完了待ち版)</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
  <style>
    body { font-family: sans-serif; margin: 20px; }
    h2 { margin-bottom: 0.2em; }
    textarea { width: 100%; height: 4em; margin-bottom: 0.5em; }
    .qr-container { display: flex; align-items: center; gap: 10px; margin: 1em 0; }
    #chat { border-top: 1px solid #ccc; padding-top: 1em; display: none; }
    #messages { height: 150px; overflow-y: auto; border: 1px solid #ddd; padding: 0.5em; margin-bottom: 0.5em; }
    input, button { padding: 0.5em; }
  </style>
</head>
<body>
  <h1>WebRTC チャット（ICE完了待ち対応）</h1>

  <h2>1. Offer 作成</h2>
  <button id="create-offer">Offer を作成</button>
  <div class="qr-container">
    <div id="offer-qr"></div>
    <button id="copy-offer">Offer をコピー</button>
  </div>
  <textarea id="remote-answer-sdp" placeholder="相手の Answer SDP をペースト"></textarea>
  <button id="set-remote-answer" disabled>Remote Answer を設定</button>

  <hr/>

  <h2>2. Answer 作成</h2>
  <textarea id="remote-offer-sdp" placeholder="相手の Offer SDP をペースト"></textarea>
  <button id="generate-answer">Answer を作成</button>
  <div class="qr-container">
    <div id="answer-qr"></div>
    <button id="copy-answer">Answer をコピー</button>
  </div>

  <hr/>

  <div id="chat">
    <h2>チャット</h2>
    <div id="messages"></div>
    <input id="message-input" placeholder="メッセージ入力…" />
    <button id="send">送信</button>
  </div>

  <script>
    const pc = new RTCPeerConnection({ iceServers: [{ urls: "stun:stun.l.google.com:19302" }] });
    let dataChannel, currentOfferSDP = "", currentAnswerSDP = "";

    // ICE完了を待つ関数
    function waitIceGatheringComplete(pc) {
      return new Promise(resolve => {
        if (pc.iceGatheringState === "complete") return resolve();
        const check = () => {
          if (pc.iceGatheringState === "complete") {
            pc.removeEventListener("icegatheringstatechange", check);
            resolve();
          }
        };
        pc.addEventListener("icegatheringstatechange", check);
      });
    }

    function genQR(elId, text) {
      document.getElementById(elId).innerHTML = "";
      new QRCode(document.getElementById(elId), { text, width: 200, height: 200 });
    }

    function setupDataChannel(dc) {
      dc.onopen = () => document.getElementById("chat").style.display = "block";
      dc.onmessage = e => {
        const d = document.createElement("div");
        d.textContent = "相手: " + e.data;
        document.getElementById("messages").appendChild(d);
      };
    }

    document.getElementById("create-offer").onclick = async () => {
      dataChannel = pc.createDataChannel("chat");
      setupDataChannel(dataChannel);

      const offer = await pc.createOffer();
      await pc.setLocalDescription(offer);
      await waitIceGatheringComplete(pc); // ICE完了を待つ

      currentOfferSDP = JSON.stringify(pc.localDescription);
      genQR("offer-qr", currentOfferSDP);
      document.getElementById("set-remote-answer").disabled = false;
    };

    document.getElementById("set-remote-answer").onclick = async () => {
      if (pc.signalingState !== "have-local-offer") {
        return alert(`signalingState は "${pc.signalingState}" です。先にOfferを作成してください。`);
      }
      const val = document.getElementById("remote-answer-sdp").value.trim();
      if (!val) return alert("Answer SDP をペーストしてください");
      const answer = JSON.parse(val);
      try {
        await pc.setRemoteDescription(answer);
      } catch (e) {
        alert("Answer設定エラー: " + e.message);
      }
    };

    document.getElementById("generate-answer").onclick = async () => {
      const val = document.getElementById("remote-offer-sdp").value.trim();
      if (!val) return alert("Offer SDP をペーストしてください");

      const offer = JSON.parse(val);
      await pc.setRemoteDescription(offer);

      pc.ondatachannel = e => { dataChannel = e.channel; setupDataChannel(dataChannel); };

      const answer = await pc.createAnswer();
      await pc.setLocalDescription(answer);
      await waitIceGatheringComplete(pc); // ICE完了を待つ

      currentAnswerSDP = JSON.stringify(pc.localDescription);
      genQR("answer-qr", currentAnswerSDP);
    };

    document.getElementById("send").onclick = () => {
      const txt = document.getElementById("message-input").value;
      if (!txt || !dataChannel || dataChannel.readyState !== "open") return;
      dataChannel.send(txt);
      const d = document.createElement("div");
      d.textContent = "あなた: " + txt;
      document.getElementById("messages").appendChild(d);
      document.getElementById("message-input").value = "";
    };

    document.getElementById("copy-offer").onclick = () => {
      if (!currentOfferSDP) return alert("Offer が空です");
      navigator.clipboard.writeText(currentOfferSDP).then(
        () => alert("Offer をコピーしました"),
        () => alert("コピーに失敗しました")
      );
    };
    document.getElementById("copy-answer").onclick = () => {
      if (!currentAnswerSDP) return alert("Answer が空です");
      navigator.clipboard.writeText(currentAnswerSDP).then(
        () => alert("Answer をコピーしました"),
        () => alert("コピーに失敗しました")
      );
    };
  </script>
</body>
</html>
