<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <title>WebRTC Chat</title>
  <!-- QR & 圧縮ライブラリ読み込み -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/lz-string/1.4.4/lz-string.min.js"></script>
  <style>
    body{font-family:sans-serif;margin:20px;}
    .qr-container{display:flex;align-items:center;gap:10px;margin:1em 0;}
    textarea{width:100%;height:4em;margin:0.5em 0;}
    #chat{display:none;border-top:1px solid #ccc;padding-top:1em;}
    #messages{height:150px;overflow-y:auto;border:1px solid #ddd;padding:0.5em;margin-bottom:0.5em;}
  </style>
</head>
<body>
  <h1>WebRTC Chat</h1>

  <h2>1. Offer 作成</h2>
  <button id="create-offer">Offer を作成</button>
  <div class="qr-container">
    <div id="offer-qr"></div>
    <button id="copy-offer">Offer をコピー</button>
  </div>
  <textarea id="remote-answer" placeholder="相手の 圧縮Answer をペースト"></textarea>
  <button id="set-answer" disabled>Remote Answer 設定</button>

  <hr/>

  <h2>2. Answer 作成</h2>
  <textarea id="remote-offer" placeholder="相手の 圧縮Offer をペースト"></textarea>
  <button id="gen-answer">Answer を作成</button>
  <div class="qr-container">
    <div id="answer-qr"></div>
    <button id="copy-answer">Answer をコピー</button>
  </div>

  <hr/>

  <div id="chat">
    <h2>チャット</h2>
    <div id="messages"></div>
    <input id="msg" placeholder="メッセージ…" /><button id="send">送信</button>
  </div>

  <script>
    // PeerConnection
    const pc = new RTCPeerConnection({ iceServers:[{urls:"stun:stun.l.google.com:19302"}] });
    let dc, offerCMP="", answerCMP="";

    // QR生成
    function genQR(id,txt){
      const el=document.getElementById(id);
      el.innerHTML="";
      new QRCode(el,{text:txt,width:200,height:200});
    }

    // DataChannel セットアップ
    function setupDC(channel){
      channel.onopen = ()=>document.getElementById("chat").style.display="block";
      channel.onmessage = e=>{
        const d=document.createElement("div");
        d.textContent="相手: "+e.data;
        document.getElementById("messages").appendChild(d);
      };
    }

    // ICE Gathering 完了待ち
    function waitIceComplete(pc){
      return new Promise(res=>{
        if(pc.iceGatheringState==="complete") return res();
        function chk(){
          if(pc.iceGatheringState==="complete"){
            pc.removeEventListener("icegatheringstatechange",chk);
            res();
          }
        }
        pc.addEventListener("icegatheringstatechange",chk);
      });
    }

    // Offer 作成
    document.getElementById("create-offer").onclick = async ()=>{
      dc = pc.createDataChannel("chat"); setupDC(dc);
      const offer = await pc.createOffer();
      await pc.setLocalDescription(offer);
      await waitIceComplete(pc);

      // 圧縮
      offerCMP = LZString.compressToEncodedURIComponent(
        JSON.stringify(pc.localDescription)
      );
      genQR("offer-qr", offerCMP);
      document.getElementById("set-answer").disabled = false;
    };

    // Remote Answer 設定
    document.getElementById("set-answer").onclick = async ()=>{
      const comp = document.getElementById("remote-answer").value.trim();
      if(!comp) return alert("Answer をペーストして下さい");
      const json = JSON.parse(
        LZString.decompressFromEncodedURIComponent(comp)
      );
      await pc.setRemoteDescription(json);
    };

    // Answer 作成
    document.getElementById("gen-answer").onclick = async ()=>{
      const comp = document.getElementById("remote-offer").value.trim();
      if(!comp) return alert("Offer をペーストして下さい");
      const jsonOffer = JSON.parse(
        LZString.decompressFromEncodedURIComponent(comp)
      );
      await pc.setRemoteDescription(jsonOffer);

      pc.ondatachannel = e=>{ dc = e.channel; setupDC(dc); };

      const answer = await pc.createAnswer();
      await pc.setLocalDescription(answer);
      await waitIceComplete(pc);

      // 圧縮
      answerCMP = LZString.compressToEncodedURIComponent(
        JSON.stringify(pc.localDescription)
      );
      genQR("answer-qr", answerCMP);
    };

    // メッセージ送信
    document.getElementById("send").onclick = ()=>{
      const txt = document.getElementById("msg").value;
      if(!txt||!dc||dc.readyState!=="open")return;
      dc.send(txt);
      const d=document.createElement("div");
      d.textContent="あなた: "+txt;
      document.getElementById("messages").appendChild(d);
      document.getElementById("msg").value="";
    };

    // コピー機能
    document.getElementById("copy-offer").onclick =
      ()=>navigator.clipboard.writeText(offerCMP).then(()=>alert("Copied"));
    document.getElementById("copy-answer").onclick =
      ()=>navigator.clipboard.writeText(answerCMP).then(()=>alert("Copied"));
  </script>
</body>
</html>
