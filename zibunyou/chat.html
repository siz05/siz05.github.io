<!DOCTYPE html>
<html lang="ja">
<head><meta charset="UTF-8"><title>QR版WebRTCチャット</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/lz-string/1.4.4/lz-string.min.js"></script>
<style>
  body{font-family:sans-serif;padding:1em}
  .qr{display:flex;align-items:center;gap:1em;margin:.5em 0}
  textarea{width:100%;height:4em;margin:.5em 0}
  #chat{display:none;border-top:1px solid#ccc;margin-top:1em;padding-top:1em}
</style>
</head>
<body>

<div id="setup">
  <h1>準備画面</h1>
  <button id="o">Offer→QR</button>
  <div class="qr"><div id="qo"></div><button id="co">Copy</button></div>
  <textarea id="ain" placeholder="Answer貼付"></textarea>
  <button id="sa">Set Answer</button>
  <hr>
  <textarea id="oin" placeholder="Offer貼付"></textarea>
  <button id="a">Answer→QR</button>
  <div class="qr"><div id="qa"></div><button id="ca">Copy</button></div>
</div>

<div id="chat">
  <div id="msg" style="border:1px solid#ccc;padding:.5em;height:100px;overflow:auto"></div>
  <input id="in"><button id="s">send</button>
</div>

<script>
  const pc = new RTCPeerConnection({ iceServers:[{urls:'stun:stun.l.google.com:19302'}] });
  let dc, csdp, asdp;

  // QR描画
  function qr(id, txt){
    const el = document.getElementById(id);
    el.innerHTML = '';
    new QRCode(el, { text: txt, width:160, height:160 });
  }

  // ICE完了待ち
  function waitIce(){
    return new Promise(r=>{
      if (pc.iceGatheringState==='complete') return r();
      pc.onicegatheringstatechange = ()=>{
        if (pc.iceGatheringState==='complete') r();
      };
    });
  }

  // 圧縮＋型付与／復元
  function bake(s, t){ return t + ':' + LZString.compressToBase64(s) }
  function unbake(x){
    const [t, c] = x.split(':');
    return { type: t, sdp: LZString.decompressFromBase64(c) };
  }

  // チャット画面表示
  function showChat(){
    document.getElementById('setup').style.display='none';
    document.getElementById('chat').style.display='block';
  }

  // メッセージ受信／送信準備
  function setupDC(channel){
    dc = channel;
    dc.onopen = showChat;
    dc.onmessage = e=>{
      const d = document.createElement('div');
      d.textContent = '相: ' + e.data;
      document.getElementById('msg').appendChild(d);
    };
  }

  // Offer側で作ったチャンネルをAnswer側も受け取る
  pc.ondatachannel = e => setupDC(e.channel);

  // Offer 作成（Offer側のみ createDataChannel）
  document.getElementById('o').onclick = async ()=>{
    // Offer 側チャンネル
    setupDC(pc.createDataChannel('chat'));

    const o = await pc.createOffer();
    await pc.setLocalDescription(o);
    await waitIce();

    csdp = bake(pc.localDescription.sdp, 'offer');
    qr('qo', csdp);
    document.getElementById('co').onclick = ()=>navigator.clipboard.writeText(csdp);
  };

  // リモート Answer 設定
  document.getElementById('sa').onclick = async ()=>{
    const v = document.getElementById('ain').value.trim();
    if (!v) return;
    const ans = unbake(v);
    await pc.setRemoteDescription(ans);
  };

  // Answer 作成（Answer側はチャンネルを作らない）
  document.getElementById('a').onclick = async ()=>{
    const v = document.getElementById('oin').value.trim();
    if (!v) return alert('Offerを貼ってください');
    const of = unbake(v);

    await pc.setRemoteDescription(of);
    const ans = await pc.createAnswer();
    await pc.setLocalDescription(ans);
    await waitIce();

    asdp = bake(pc.localDescription.sdp, 'answer');
    qr('qa', asdp);
    document.getElementById('ca').onclick = ()=>navigator.clipboard.writeText(asdp);
  };

  // メッセージ送信
  document.getElementById('s').onclick = ()=>{
    const t = document.getElementById('in').value;
    if (!dc || dc.readyState !== 'open' || !t) return;
    dc.send(t);
    const d = document.createElement('div');
    d.textContent = '自: ' + t;
    document.getElementById('msg').appendChild(d);
    document.getElementById('in').value = '';
  };
</script>
</body>
</html>
