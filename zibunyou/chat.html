<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>WebRTC Chat with QR Code Signaling</title>
  <script src="https://cdn.jsdelivr.net/npm/qrcode/build/qrcode.min.js"></script>
  <style>
    body { font-family: Arial, sans-serif; }
    #qrCode { margin: 20px 0; }
    #messages { list-style-type: none; padding: 0; }
    #messageInput { width: 100%; padding: 8px; }
    #sendBtn { padding: 8px 16px; cursor: pointer; }
  </style>
</head>
<body>

  <h2>WebRTC Chat - No Signaling Server</h2>
  
  <div>
    <h3>Send Message:</h3>
    <textarea id="messageInput" placeholder="Type your message"></textarea><br>
    <button id="sendBtn">Send Message</button>
  </div>
  
  <div>
    <h3>QR Code will appear here:</h3>
    <canvas id="qrCode"></canvas>
  </div>

  <div>
    <h3>Received Messages:</h3>
    <ul id="messages"></ul>
  </div>

  <script>
    let localConnection;
    let remoteConnection;
    let dataChannel;

    // Create the local peer connection
    function createOffer() {
      localConnection = new RTCPeerConnection();

      // Set up the data channel
      dataChannel = localConnection.createDataChannel("chat");

      dataChannel.onmessage = function(event) {
        const li = document.createElement("li");
        li.textContent = `Message from peer: ${event.data}`;
        document.getElementById("messages").appendChild(li);
      };

      // Create an offer
      localConnection.createOffer().then((offer) => {
        return localConnection.setLocalDescription(offer);
      }).then(() => {
        const offerText = JSON.stringify(localConnection.localDescription);
        generateQRCode(offerText);
      }).catch((error) => {
        console.error('Error creating offer:', error);
      });
    }

    // Generate a QR code from a given string
    function generateQRCode(data) {
      if (!data) {
        console.error('No data provided for QR code');
        return;
      }

      const canvasElement = document.getElementById("qrCode");

      if (!canvasElement) {
        console.error('Canvas element with id "qrCode" not found!');
        return;
      }

      try {
        // QRコードをcanvasに描画
        QRCode.toCanvas(canvasElement, data, function (error) {
          if (error) {
            console.error('Error generating QR code:', error);
          } else {
            console.log('QR code generated successfully');
          }
        });
      } catch (error) {
        console.error('Error in generateQRCode function:', error);
      }
    }

    // Handle QR data received from another peer
    function handleQRData(data) {
      const description = JSON.parse(data);
      remoteConnection = new RTCPeerConnection();

      remoteConnection.ondatachannel = function(event) {
        const receiveChannel = event.channel;
        receiveChannel.onmessage = function(event) {
          const li = document.createElement("li");
          li.textContent = `Message from peer: ${event.data}`;
          document.getElementById("messages").appendChild(li);
        };
      };

      remoteConnection.setRemoteDescription(description).then(() => {
        return remoteConnection.createAnswer();
      }).then((answer) => {
        return remoteConnection.setLocalDescription(answer);
      }).then(() => {
        const answerText = JSON.stringify(remoteConnection.localDescription);
        generateQRCode(answerText);
      }).catch((error) => {
        console.error('Error handling remote offer or generating answer:', error);
      });
    }

    // Handle send button click
    document.getElementById("sendBtn").onclick = function() {
      const message = document.getElementById("messageInput").value;
      if (message && dataChannel) {
        dataChannel.send(message);
        const li = document.createElement("li");
        li.textContent = `You: ${message}`;
        document.getElementById("messages").appendChild(li);
        document.getElementById("messageInput").value = '';
      }
    };

    // Start the process by generating the initial offer or waiting for a QR code scan
    if (window.location.hash === "#offer") {
      createOffer();  // Client A creates an offer
    } else {
      const qrCodeData = prompt("Scan QR code from the other peer or paste the offer here:");
      handleQRData(qrCodeData);  // Client B reads the offer
    }

  </script>

</body>
</html>
