<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>WebRTC チャット（QRコードで接続）</title>
  <!-- QRコード生成用のライブラリ -->
  <script src="https://cdn.jsdelivr.net/npm/qrcode/build/qrcode.min.js"></script>
  <style>
    body { font-family: Arial, sans-serif; }
    #qrCode { margin: 20px 0; }
    #messages { list-style-type: none; padding: 0; }
    #messageInput { width: 100%; padding: 8px; }
    #sendBtn { padding: 8px 16px; cursor: pointer; }
  </style>
</head>
<body>

  <h2>WebRTC チャット - シグナリングサーバーなし</h2>
  
  <div>
    <h3>メッセージを送信:</h3>
    <textarea id="messageInput" placeholder="メッセージを入力"></textarea><br>
    <button id="sendBtn">メッセージ送信</button>
  </div>
  
  <div>
    <h3>QRコードがここに表示されます:</h3>
    <canvas id="qrCode"></canvas> <!-- QRコード表示用のキャンバス -->
  </div>

  <div>
    <h3>受信したメッセージ:</h3>
    <ul id="messages"></ul>
  </div>

  <script>
    let localConnection;
    let remoteConnection;
    let dataChannel;

    // オファーを作成する関数（送信者側）
    function createOffer() {
      localConnection = new RTCPeerConnection();

      // データチャネルを作成
      dataChannel = localConnection.createDataChannel("chat");

      // データチャネルが開いたときにメッセージ送信を許可
      dataChannel.onopen = function() {
        alert("データチャネルが開きました。メッセージ送信可能です。");
      };

      // メッセージ受信時のイベント
      dataChannel.onmessage = function(event) {
        const li = document.createElement("li");
        li.textContent = `相手からのメッセージ: ${event.data}`;
        document.getElementById("messages").appendChild(li);
      };

      // ICE候補が発見されたときの処理
      localConnection.onicecandidate = function(event) {
        if (event.candidate) {
          // 自分のICE候補を相手に送信（QRコードで）
          sendCandidate(event.candidate);
        }
      };

      // オファーを作成し、ローカルの接続に設定
      localConnection.createOffer().then((offer) => {
        return localConnection.setLocalDescription(offer);
      }).then(() => {
        // オファーをQRコードとして生成
        const offerText = JSON.stringify(localConnection.localDescription);
        generateQRCode(offerText);
      }).catch((error) => {
        alert('オファー作成中にエラーが発生しました: ' + error);
      });
    }

    // ICE候補を送信する関数
    function sendCandidate(candidate) {
      // ここでQRコードなどを利用して相手に送信するロジックを実装
      const candidateText = JSON.stringify(candidate);
      alert("ICE候補を送信: " + candidateText);
      // QRコードで送る場合は、ここで生成して送信
    }

    // QRコードを生成する関数
    function generateQRCode(data) {
      if (!data) {
        alert('QRコードにデータがありません');
        return;
      }

      const canvasElement = document.getElementById("qrCode");

      if (!canvasElement) {
        alert('キャンバス要素が見つかりません。');
        return;
      }

      try {
        // QRコードをキャンバスに描画
        QRCode.toCanvas(canvasElement, data, function (error) {
          if (error) {
            alert('QRコード生成時にエラーが発生しました: ' + error);
          } else {
            alert('QRコードの生成に成功しました');
          }
        });
      } catch (error) {
        alert('QRコード生成中にエラーが発生しました: ' + error);
      }
    }

    // QRコードデータを受け取って処理する関数
    function handleQRData(data) {
      try {
        // 受け取ったデータをJSONに変換して、オファーの内容を設定
        const description = JSON.parse(data);
        remoteConnection = new RTCPeerConnection();

        // データチャネルを受信
        remoteConnection.ondatachannel = function(event) {
          const receiveChannel = event.channel;
          receiveChannel.onmessage = function(event) {
            const li = document.createElement("li");
            li.textContent = `相手からのメッセージ: ${event.data}`;
            document.getElementById("messages").appendChild(li);
          };
        };

        // ICE候補が発見されたときの処理
        remoteConnection.onicecandidate = function(event) {
          if (event.candidate) {
            // 相手のICE候補を自分に設定
            sendCandidate(event.candidate);
          }
        };

        // リモートの接続設定
        remoteConnection.setRemoteDescription(description).then(() => {
          return remoteConnection.createAnswer();
        }).then((answer) => {
          return remoteConnection.setLocalDescription(answer);
        }).then(() => {
          // アンサーをQRコードとして生成
          const answerText = JSON.stringify(remoteConnection.localDescription);
          generateQRCode(answerText);
        }).catch((error) => {
          alert('オファーの処理中にエラーが発生しました: ' + error);
        });

      } catch (error) {
        alert('QRコードが無効です。正しいオファー情報を入力してください。');
        alert('QRコードデータの処理中にエラーが発生しました: ' + error);
      }
    }

    // メッセージ送信ボタンがクリックされたときの処理
    document.getElementById("sendBtn").onclick = function() {
      const message = document.getElementById("messageInput").value;
      if (message && dataChannel && dataChannel.readyState === "open") {
        dataChannel.send(message);  // データチャネル経由でメッセージ送信
        const li = document.createElement("li");
        li.textContent = `あなた: ${message}`;
        document.getElementById("messages").appendChild(li);  // 画面に表示
        document.getElementById("messageInput").value = '';  // 入力フィールドを空にする
      } else {
        alert('データチャネルが開いていません。メッセージを送信できません。');
      }
    };

    // 接続が成功した場合にログを表示
    function logConnectionSuccess() {
      alert("接続が確立しました。オファー側のログです。");
    }

    // ページが読み込まれた際の動作
    if (window.location.hash === "#offer") {
      // クライアントA（オファー側）がオファーを作成
      createOffer();
    } else {
      // クライアントB（受信者側）はQRコードを入力する
      const qrCodeData = prompt("他のピアからQRコードをスキャンするか、オファーをここに貼り付けてください:");
      if (qrCodeData) {
        handleQRData(qrCodeData);  // クライアントBがオファーを処理
      }
    }

    // クライアントA（オファー側）が接続成功した場合のコールバック
    if (remoteConnection && remoteConnection.iceConnectionState === "connected") {
      logConnectionSuccess();
    }
  </script>

</body>
</html>
